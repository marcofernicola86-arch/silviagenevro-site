  <h2>Entra nella Newsletter periodica!</h2>
  <p>Lascia la tua email per ricevere aggiornamenti sui corsi e progetti futuri :)</p>

  <form id="newsletterForm" accept-charset="UTF-8">
    <input type="hidden" name="token" value="NL_2026_SILVIA_9f3b7c2a_1a4d_4c8e_91f2_3c9a7b1d2e44">

    <!-- Honeypot anti-bot -->
    <div style="position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden;">
      <label>Lascia vuoto <input type="text" name="website" autocomplete="off" tabindex="-1"></label>
    </div>

    <div class="nl-grid">
      <input type="text"  name="nome"    placeholder="Nome (opzionale)" aria-label="Nome (opzionale)" autocomplete="given-name">
      <input type="text"  name="cognome" placeholder="Cognome (opzionale)" aria-label="Cognome (opzionale)" autocomplete="family-name">
    </div>

    <input type="email" name="email" placeholder="La tua email" aria-label="La tua email" autocomplete="email" required>

    <label class="consenso">
      <input type="checkbox" name="consenso_newsletter" required>
      Acconsento a ricevere comunicazioni e newsletter via email. Ho letto l’
      <a href="/privacy/" target="_blank" rel="noopener">informativa privacy</a>.
    </label>

    <button type="submit" id="nlBtn">Iscriviti</button>
    <span id="newsletterMsg" role="status" aria-live="polite" style="margin-left:10px; display:none;"></span>
  </form>

  <script>
  (function () {
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbzqr2T9fAcqCnmaw1OZ6AA5A_raR5WJEGLOASFuJFx7kyhijvGPmJlRYjLnfc-ctF1DZg/exec"; // <-- incolla qui il tuo /exec
    const form = document.getElementById("newsletterForm");
    const msg  = document.getElementById("newsletterMsg");
    const btn  = document.getElementById("nlBtn");
    if (!form || !msg) return;

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      msg.style.display = "inline";
      msg.textContent = "Invio in corso...";
      if (btn) btn.disabled = true;

      const fd = new FormData(form);

      // anti-bot: se honeypot compilato, fingi successo e stop
      if ((fd.get("website") || "").toString().trim() !== "") {
        msg.textContent = "Iscrizione inviata ✅";
        form.reset();
        if (btn) btn.disabled = false;
        return;
      }

      try {
        // no-cors: il browser non blocca per CORS e non aspetta risposta “leggibile”
        await fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: fd });

        // feedback immediato (robusto)
        msg.textContent = "Iscrizione inviata ✅";
        form.reset();
      } catch (err) {
        msg.textContent = "Errore di rete. Riprova tra poco.";
      } finally {
        if (btn) btn.disabled = false;
      }
    });
  })();
  </script>

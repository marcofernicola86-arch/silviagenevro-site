[build]
  command = "npm run build"
  publish = "_site"

# Il vecchio indirizzo netlify.app porta al dominio ufficiale.
# Le anteprime di Netlify (deploy-preview-...) hanno un indirizzo diverso e non sono toccate.
[[redirects]]
  from = "https://silviagenevro.netlify.app/*"
  to = "https://silviagenevro.it/:splat"
  status = 301
  force = true

# Il blog ora è dentro il sito (silviagenevro.it/blog/).
# Quando blog.silviagenevro.it punterà a Netlify, i vecchi indirizzi di Blogger portano agli articoli nuovi.
[[redirects]]
  from = "https://blog.silviagenevro.it/2026/09/svegliarsi-dal-pilota-automatico-perche.html"
  to = "https://silviagenevro.it/blog/svegliarsi-dal-pilota-automatico/"
  status = 301
  force = true

[[redirects]]
  from = "https://blog.silviagenevro.it/2026/02/mbsr-la-mindfulness-che-ridisegna-il.html"
  to = "https://silviagenevro.it/blog/mbsr-mindfulness-ridisegna-cervello/"
  status = 301
  force = true

[[redirects]]
  from = "https://blog.silviagenevro.it/*"
  to = "https://silviagenevro.it/blog/"
  status = 301
  force = true

# Il vecchio pannello di amministrazione del blog interno non esiste più.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

# Il corso "Gestione dello Stress – 4 incontri" non è più in programma: chi arriva al vecchio indirizzo vede i corsi attuali.
[[redirects]]
  from = "/introduttivo/*"
  to = "/#corsi"
  status = 301
  force = true

# Link breve per chiedere una recensione: silviagenevro.it/recensione porta al modulo di recensione Google.
# Non compare sul sito: serve da mandare su WhatsApp o da stampare. Se cambia il link di Google, basta aggiornarlo qui.
[[redirects]]
  from = "/recensione"
  to = "https://g.page/r/CR_8HUH1DPyiEAE/review"
  status = 302
  force = true

[[redirects]]
  from = "/recensione/*"
  to = "https://g.page/r/CR_8HUH1DPyiEAE/review"
  status = 302
  force = true

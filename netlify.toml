[build]
  command = "npm run build"
  publish = "_site"

# Il vecchio indirizzo netlify.app porta al dominio ufficiale.
# Le anteprime di Netlify (deploy-preview-...) hanno un indirizzo diverso e non sono toccate.
[[redirects]]
  from = "https://silviagenevro.netlify.app/*"
  to = "https://silviagenevro.it/:splat"
  status = 301
  force = true

# Il blog è su blog.silviagenevro.it: i vecchi indirizzi del blog interno portano lì.
[[redirects]]
  from = "/blog/*"
  to = "https://blog.silviagenevro.it/"
  status = 301
  force = true

# Il vecchio pannello di amministrazione del blog interno non esiste più.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true
